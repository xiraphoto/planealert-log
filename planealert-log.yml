name: PlaneAlert logger

on:
  schedule:
    - cron: '*/5 * * * *'     # GitHub runs this every 5-15 minutes
  workflow_dispatch:          # "Run workflow" button

permissions:
  contents: write

concurrency:
  group: planealert-logger
  cancel-in-progress: false

env:
  PLANEALERT_TZ: Europe/Oslo  # the day starts at midnight in this time zone

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Get today's log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          TODAY=$(TZ="$PLANEALERT_TZ" date +%F)
          gh release view data >/dev/null 2>&1 || \
            gh release create data --title "PlaneAlert log" --notes "Daily PlaneAlert logs. Updated automatically - do not edit."
          gh release download data -p "day-$TODAY.json.gz" -D out || echo "No log yet for $TODAY"

      - name: Scan airports
        run: python3 logger/logger.py out

      - name: Upload log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload data out/day-*.json.gz --clobber
          CUT=$(TZ="$PLANEALERT_TZ" date -d '7 days ago' +%F)
          for a in $(gh release view data --json assets -q '.assets[].name'); do
            d=${a#day-}; d=${d%.json.gz}
            if [[ "$d" < "$CUT" ]]; then gh release delete-asset data "$a" -y; fi
          done

      - name: Daily heartbeat (keeps the schedule from being paused)
        run: |
          D=$(date -u +%F)
          if [ "$(cat logger/heartbeat.txt 2>/dev/null)" != "$D" ]; then
            echo "$D" > logger/heartbeat.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add logger/heartbeat.txt
            git commit -m "heartbeat $D"
            git push || echo "push failed (will retry next run)"
          fi
